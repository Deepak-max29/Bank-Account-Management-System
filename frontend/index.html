<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Account Management System - Core Banking Platform</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/pages.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <a href="#dashboard" class="brand-badge">
                    <div class="brand-icon-box">🏛</div>
                    <div class="brand-text">
                        <h2>BAMS Bank</h2>
                        <span>Premier Core</span>
                    </div>
                </a>
                <button id="sidebar-close" class="mobile-only">✕</button>
            </div>
            
            <nav class="sidebar-nav">
                <span class="nav-section-title">Overview</span>
                <a href="#dashboard" class="nav-item" data-route="dashboard"><span>⊞</span> Dashboard</a>
                
                <span class="nav-section-title">Core Banking</span>
                <a href="#customers" class="nav-item" data-route="customers"><span>👤</span> Customers</a>
                <a href="#accounts" class="nav-item" data-route="accounts"><span>💳</span> Accounts</a>
                <a href="#transactions" class="nav-item" data-route="transactions"><span>↔</span> Transactions</a>
                <a href="#beneficiaries" class="nav-item" data-route="beneficiaries"><span>✓</span> Beneficiaries</a>
                <a href="#cards" class="nav-item" data-route="cards"><span>🏷️</span> Cards</a>
                
                <span class="nav-section-title">Credit & Lending</span>
                <a href="#loans" class="nav-item" data-route="loans"><span>📑</span> Loans</a>
                <a href="#loan-payments" class="nav-item" data-route="loan-payments"><span>📄</span> Loan Payments</a>
                
                <span class="nav-section-title">Organization</span>
                <a href="#banks" class="nav-item" data-route="banks"><span>🏛</span> Banks</a>
                <a href="#branches" class="nav-item" data-route="branches"><span>📍</span> Branches</a>
                <a href="#employees" class="nav-item" data-route="employees"><span>👥</span> Employees</a>
                
                <span class="nav-section-title">Governance</span>
                <a href="#audit-logs" class="nav-item admin-only" data-route="audit-logs"><span>🔒</span> Audit Logs</a>
                <a href="#reports" class="nav-item" data-route="reports"><span>📊</span> Reports</a>
                <a href="#settings" class="nav-item" data-route="settings"><span>⚙</span> Settings</a>
            </nav>
        </aside>

        <!-- Main Content -->
        <div class="main-wrapper">
            <header class="top-header">
                <div class="header-left">
                    <button id="sidebar-toggle" class="mobile-only">☰</button>
                    <h1 id="page-title">Dashboard</h1>
                </div>
                <div class="header-right">
                    <div class="user-badge-header">
                        <span class="avatar">👤</span>
                        <span id="user-info">Loading...</span>
                    </div>
                    <button id="logout-btn" class="btn btn-outline btn-sm">
                        <span>🚪</span> Logout
                    </button>
                </div>
            </header>

            <main class="main-content" id="main-content">
                <!-- Dynamic content loaded by router -->
            </main>
        </div>
    </div>

    <!-- Toast Notifications Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Modal Dialog Overlay -->
    <div id="modal-container" class="modal-overlay" style="display: none;">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modal-title">Dialog</h3>
                <button class="modal-close" onclick="closeModal()">✕</button>
            </div>
            <div class="modal-body" id="modal-body"></div>
            <div class="modal-footer" id="modal-footer"></div>
        </div>
    </div>

    <!-- Core Scripts -->
    <script src="js/utils.js"></script>
    <script src="js/components.js"></script>
    <script src="js/api.js"></script>
    
    <!-- Functional Modules -->
    <script src="js/dashboard.js"></script>
    <script src="js/banks.js"></script>
    <script src="js/branches.js"></script>
    <script src="js/employees.js"></script>
    <script src="js/customers.js"></script>
    <script src="js/accounts.js"></script>
    <script src="js/transactions.js"></script>
    <script src="js/beneficiaries.js"></script>
    <script src="js/loans.js"></script>
    <script src="js/loanPayments.js"></script>
    <script src="js/cards.js"></script>
    <script src="js/auditLogs.js"></script>
    <script src="js/reports.js"></script>
    <script src="js/settings.js"></script>
    
    <!-- App Entry Point & Routing -->
    <script src="js/app.js"></script>
</body>
</html>
