# ==============================================================================
# Cloud Profile for Render Deployment (Permanent, Self-Contained, 24/7)
# ==============================================================================

# Database: H2 in Oracle Compatibility Mode with Persistent File Storage
# Matches all Oracle syntax: SEQUENCE.NEXTVAL, DUAL, SYSDATE, NVL
spring.datasource.url=jdbc:h2:file:/app/data/bankdb;MODE=Oracle;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-test-query=SELECT 1 FROM DUAL

# Automatic Schema and Seed Data Initialization
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-cloud.sql
spring.sql.init.continue-on-error=true

# Logging
logging.level.com.bank=INFO
logging.level.org.springframework.jdbc=INFO
