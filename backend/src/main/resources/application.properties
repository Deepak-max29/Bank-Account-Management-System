# ============================================================
# Bank Account Management System - Application Configuration
# ============================================================

# Server Configuration
server.port=8081
server.servlet.context-path=/

# Application Name
spring.application.name=Bank Account Management System

# ============================================================
# Oracle XE Database Configuration
# ============================================================
# Oracle XE 10.2.0 default connection
spring.datasource.url=jdbc:oracle:thin:@localhost:1521:XE
spring.datasource.username=SYSTEM
spring.datasource.password=manager
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Connection Pool (using HikariCP)
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-test-query=SELECT 1 FROM DUAL

# ============================================================
# Spring JDBC
# ============================================================
spring.jdbc.template.query-timeout=30

# ============================================================
# Spring Security Session
# ============================================================
server.servlet.session.timeout=30m

# ============================================================
# Static Resources - Serve frontend files
# ============================================================
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**

# ============================================================
# Multipart (CSV Import)
# ============================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ============================================================
# Logging
# ============================================================
logging.level.com.bank=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.springframework.jdbc=DEBUG
logging.level.com.zaxxer.hikari=DEBUG
logging.level.oracle.jdbc=DEBUG
logging.level.root=WARN
logging.file.name=logs/bank-app.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ============================================================
# Application Business Rules
# ============================================================
# Minimum balance for SAVINGS accounts (in INR)
bank.savings.minimum-balance=500.00
# Minimum balance for CURRENT accounts (in INR)
bank.current.minimum-balance=1000.00
# Maximum transfer amount per transaction
bank.transfer.max-amount=1000000.00
# Session timeout in minutes
bank.session.timeout-minutes=30

# ============================================================
# Actuator - Health and Info endpoints
# ============================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.health.db.enabled=true

# ============================================================
# Error Handling - Never expose internal details
# ============================================================
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-binding-errors=never
